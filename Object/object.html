<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissor</title>
</head>
<body>
    <h1>Select!! rock,paper or scissor</h1>
    <button id="rock">rock</button>
    <button id="paper">paper</button>
    <button id="scissor">scissor</button>
    <button id="reset">reset score</button>
    <div id="result"></div>
    <div id="score-board"></div>

    <script>
        let score = {
            win:0,
            losses:0,
            tie:0
        };
       
        function showscore(){
            document.getElementById("score-board").textContent = `win = ${score.win} , tie = ${score.tie} , losses = ${score.losses}`;
        }
        function pickcomputermove(){
            let computermove = '';
            const randomnum = Math.random();
            if(randomnum>=0 && randomnum<1/3){
                computermove = 'rock';
            }else if(randomnum >=1/3 && randomnum<2/3){
                computermove = 'paper';
            }else if(randomnum >=2/3 && randomnum<1){
                computermove = 'scissor';
            }
            return computermove;
        }

        document.getElementById("rock").onclick = function(){
            let computermoveresult = pickcomputermove();
            if(computermoveresult==='rock'){
                score.tie+=1;
                document.getElementById("result").textContent = `TIE opponent selected ${computermoveresult}`;
                showscore();
                
            }else if(computermoveresult==='paper'){
                score.losses+=1;
                document.getElementById("result").textContent = `YOU LOOSE!! opponent selected ${computermoveresult}`;
                showscore();
            }else if(computermoveresult==='scissor'){
                score.win+=1;
                document.getElementById("result").textContent = `YOU WIN!! opponent selected ${computermoveresult}`;
                showscore();
            }
        }
        document.getElementById("paper").onclick = function(){
            let computermoveresult = pickcomputermove();
            if(computermoveresult==='rock'){
                score.win+=1;
                document.getElementById("result").textContent = `YOU WIN!! opponent selected ${computermoveresult}`;
                showscore();
            }else if(computermoveresult==='paper'){
                score.tie+=1;
                document.getElementById("result").textContent = `TIE opponent selected ${computermoveresult}`;
                showscore();
            }else if(computermoveresult==='scissor'){
                score.losses+=1;
                document.getElementById("result").textContent = `YOU LOOSE!! opponent selected ${computermoveresult}`;
                showscore();
            }
        }
        document.getElementById("scissor").onclick = function(){
            let computermoveresult = pickcomputermove();
            if(computermoveresult==='rock'){
                score.losses+=1;
                document.getElementById("result").textContent = `YOU LOOSE!! opponent selected ${computermoveresult}`;
                showscore();
            }else if(computermoveresult==='paper'){
                score.win+=1;
                document.getElementById("result").textContent = `YOU WIN!! opponent selected ${computermoveresult}`;
                showscore();
            }else if(computermoveresult==='scissor'){
                score.tie+=1;
                document.getElementById("result").textContent = `TIE opponent selected ${computermoveresult}`;
                showscore();
            }
        }
        document.getElementById("reset").onclick = function(){
            score.win=0;
            score.losses=0;
            score.tie=0;
            document.getElementById("result").textContent = "score reset successfully";
            showscore();
        }


    </script>
</body>
</html>
