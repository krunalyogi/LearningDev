<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    <style>
       
        #subscribe{
            padding-top: 10;
            padding-left: 10;
            padding-right: 10;
            padding-bottom: 10;
            background-color: red;
            font-weight: bold;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            border-radius: 50px;
            
        }

        #subscribe.is-subscribed{
            background-color: whitesmoke;
            color:black;
            font-family: Arial, Helvetica, sans-serif;
        }
        
    </style>    
</head>
<body>
    <h1>subscribe to this channel</h1>
    <button id="subscribe">subscribe</button>
    <script>
        const subscribestatus = document.getElementById('subscribe');
        document.getElementById('subscribe').onclick = function(){
            if(subscribestatus.innerHTML === 'subscribed'){
                subscribestatus.innerHTML = 'subscribe';
                subscribestatus.classList.remove('is-subscribed');

            }else{

                subscribestatus.classList.add('is-subscribed');
                subscribestatus.innerHTML = 'subscribed';
               
            }
            
        };
    </script>
</body>
</html>
